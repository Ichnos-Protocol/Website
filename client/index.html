<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons / app icons -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme color (mobile browser chrome) -->
    <meta name="theme-color" content="#FAFBFC" />

    <!-- Default document head; per-page <Helmet> overrides title / description / og:* / canonical -->
    <title>Ichnos Protocol — Battery advisory & EU battery-passport integration</title>
    <meta
      name="description"
      content="Practitioner-led battery advisory and EU battery-passport integration for ASEAN — systems engineering, safety, compliance, and Catena-X onboarding. Singapore · Europe."
    />
    <meta property="og:site_name" content="Ichnos Protocol" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ichnos-protocol.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ichnos-protocol.com/og-image.jpg" />

    <!-- Performance: preconnect to font + Firebase auth origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://securetoken.googleapis.com" />

    <!-- Fonts: Libre Franklin (body + display) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
